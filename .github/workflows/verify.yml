name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 20.19.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@9.2.0
      - run: make bootstrap
      - run: make verify
